modLoader="javafml"
loaderVersion="${loader_range}"
license="${license}"
issueTrackerURL="https://github.com/${mod_author}/${mod_name}/issues"

[[mods]]
    modId="${mod_id}"
    version="${version}"
    displayName="${mod_display_name}"
    displayURL="https://github.com/${mod_author}/${mod_name}"
    authors="${mod_author}"
    credits="${mod_credits}"
    description='''
    ${mod_description}
    '''
[[dependencies.${mod_id}]]
    modId="neoforge"
    mandatory=true
    versionRange="${neoforge_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="tconstruct"
    mandatory=true
    versionRange="${tic_version_range}"
    ordering="AFTER"
    side="BOTH"
