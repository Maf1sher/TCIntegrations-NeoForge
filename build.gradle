plugins {
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.140'
}

repositories {
    mavenCentral()
    maven {
        name 'DVS1 Maven FS'
        url 'https://dvs1.progwml6.com/files/maven'
    }
    maven {
        name 'BlameJared Maven'
        url 'https://maven.blamejared.com'
    }
    maven {
        name 'Curse Maven'
        url 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    // Local Mantle-NeoForge and TinkersConstruct-NeoForge builds
    flatDir {
        dirs '../../Tinkers-1.21.1-NeoForge/Mantle-NeoForge/build/libs',
             '../../Tinkers-1.21.1-NeoForge/TinkersConstruct-NeoForge/build/libs'
    }
}

group = 'com.github.wendall911.tcintegrations'
def actualVersion = version
version = "${minecraft_version}-${version}"

neoForge {
    version = neoforge_version

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    accessTransformers {
        publish(file('src/main/resources/META-INF/accesstransformer.cfg'))
    }

    runs {
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
        }

        server {
            server()
            programArguments.add('--nogui')
        }

        data {
            data()
            programArguments.addAll('--mod', 'tcintegrations', '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath())
        }
    }

    mods {
        tcintegrations {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

dependencies {
    implementation fileTree(dir: '../../Tinkers-1.21.1-NeoForge/Mantle-NeoForge/build/libs', include: 'Mantle-*.jar')
    implementation fileTree(dir: '../../Tinkers-1.21.1-NeoForge/TinkersConstruct-NeoForge/build/libs', include: 'TinkersConstruct-*.jar')

    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"

    // Integration mods (compileOnly)
    compileOnly "curse.maven:ars-nouveau-401955:8081100"
    compileOnly "curse.maven:create-328085:7963363"
    compileOnly "curse.maven:mekanism-268560:7904058"
    compileOnly "curse.maven:immersive-engineering-231951:6733669"
    compileOnly "curse.maven:projecte-226410:6611984"
    compileOnly "curse.maven:apotheosis-313970:7703848"
    compileOnly "curse.maven:the-twilight-forest-227639:7797302"
    compileOnly "curse.maven:the-undergarden-379849:7862546"
    compileOnly "curse.maven:alexs-mobs-1-21-1-port-1415721:7528193"
    compileOnly "curse.maven:iceandfire-ce-1040076:7722420"
    compileOnly "curse.maven:aquaculture-60028:7901588"
    compileOnly "curse.maven:deeperdarker-659011:7940538"
    compileOnly "curse.maven:malum-484064:7307339"
    compileOnly "curse.maven:curios-309927:6529130"
    compileOnly "curse.maven:patchouli-306770:7730942"
    // Ars Elemental added as runtime dependency for elemental armor set tracking (custom capability)
    // compileOnly "curse.maven:ars-elemental-561470:8159010"

    // Support libs
    compileOnly "curse.maven:citadel-1-21-1-port-1415723:7982052"
    compileOnly "curse.maven:lodestone-616457:7264731"
    compileOnly "curse.maven:placebo-283644:6926281"
    compileOnly "curse.maven:apothic-attributes-898963:7445079"

    // IFD CE support libs
    compileOnly "curse.maven:jupiter-1072905:7738312"
    compileOnly "curse.maven:uranus-1010827:8008516"
    compileOnly "curse.maven:architectury-api-419699:5786327"

    // Runtime mods for testing
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    runtimeOnly "curse.maven:geckolib-388172:7707149"
}

def resourceTargets = ['META-INF/neoforge.mods.toml', 'pack.mcmeta']
def replaceProperties = [
    'version': actualVersion,
    'minecraft_version': minecraft_version,
    'neoforge_version_range': neoforge_version_range,
    'loader_range': loader_range,
    'minecraft_range': minecraft_range,
    'tic_version_range': tic_version_range,
    'license': license,
    'mod_id': mod_id,
    'mod_author': mod_author,
    'mod_description': mod_description,
    'mod_display_name': mod_display_name,
    'mod_name': mod_name,
    'mod_credits': mod_credits,
    'mod_update_branch': mod_update_branch,
    'pack_format': pack_format
]

processResources {
    duplicatesStrategy(DuplicatesStrategy.FAIL)
    inputs.properties replaceProperties
    replaceProperties.put 'project', project
    exclude '.cache'

    filesMatching(resourceTargets) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
            "Specification-Title": mod_name,
            "Specification-Vendor": "${mod_author}",
            "Specification-Version": "${archiveVersion}",
            "Implementation-Title": "${mod_name}",
            "Implementation-Version": "${archiveVersion}",
            "Implementation-Vendor" :"${mod_author}",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
